name: Publish cseq to TestPyPI

on:
  workflow_dispatch:
  push:
    branches:
      - python-compat-0.0.4
    paths:
      - 'release/trigger-testpypi-0.0.4'

permissions:
  contents: read
  id-token: write

jobs:
  publish-testpypi:
    runs-on: ubuntu-latest
    environment:
      name: testpypi
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore validated source and apply compatibility overlays
        shell: bash
        run: |
          cat release/cseq_poc.zip.b64.part-* | base64 --decode > cseq_poc.zip
          echo "4a998011933c8cbe4012e00caa1552c1e964cc6c93185a4711e4afaa3963cf29  cseq_poc.zip" | sha256sum -c -
          mkdir source
          unzip -q cseq_poc.zip -d source
          cp -a release/overlay-0.0.2/. source/
          cp -a release/overlay-0.0.4/. source/
          cp -a release/overlay-0.0.4/. source/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build distributions
        shell: bash
        run: |
          python -m pip install --upgrade pip build
          cd source
          python -m build
          python -m pip install "dist/cseq-0.0.4-py3-none-any.whl[parser-tree-sitter]"
          cseq --version
          cseq doctor
          cseq docs all --output-dir ../docs-smoke

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: source/dist/
          repository-url: https://test.pypi.org/legacy/
