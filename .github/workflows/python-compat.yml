name: Python compatibility

on:
  push:
    branches:
      - python-compat-0.0.3
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: python-compat-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  supported-python:
    name: Windows / Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - uses: actions/checkout@v7

      - name: Restore validated source and apply compatibility overlays
        shell: pwsh
        run: |
          $parts = Get-ChildItem release/cseq_poc.zip.b64.part-* | Sort-Object Name
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          [IO.File]::WriteAllBytes("cseq_poc.zip", [Convert]::FromBase64String($b64))
          $actual = (Get-FileHash cseq_poc.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne "4a998011933c8cbe4012e00caa1552c1e964cc6c93185a4711e4afaa3963cf29") {
            throw "validated source archive checksum mismatch: $actual"
          }
          Expand-Archive cseq_poc.zip -DestinationPath source
          Copy-Item release/overlay-0.0.2/* source/ -Recurse -Force
          Copy-Item release/overlay-0.0.3/* source/ -Recurse -Force
          Copy-Item release/overlay-0.0.4/* source/ -Recurse -Force

      - uses: actions/setup-python@v7
        if: matrix.python-version != '3.15'
        with:
          python-version: ${{ matrix.python-version }}
          check-latest: true

      - name: Install Python 3.15.0 from python.org while setup-python manifest catches up
        if: matrix.python-version == '3.15'
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "python-3.15.0-amd64.exe"
          $target = Join-Path $env:RUNNER_TEMP "python315"
          Invoke-WebRequest "https://www.python.org/ftp/python/3.15.0/python-3.15.0-amd64.exe" -OutFile $installer
          $args = @(
            "/quiet",
            "InstallAllUsers=0",
            "TargetDir=$target",
            "Include_pip=1",
            "Include_launcher=0",
            "Include_test=0",
            "PrependPath=0",
            "Shortcuts=0"
          )
          $proc = Start-Process -FilePath $installer -ArgumentList $args -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            throw "Python 3.15 installer failed with exit code $($proc.ExitCode)"
          }
          $target | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          (Join-Path $target "Scripts") | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Ensure LLVM/Clang
        shell: pwsh
        run: |
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) {
            choco install llvm --no-progress -y
          }
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install and test
        shell: pwsh
        working-directory: source
        run: |
          python --version
          $minor = [int](python -c "import sys; print(sys.version_info.minor)")
          if ($minor -lt 9) {
            python -m pip install --upgrade "pip<25.1"
          } else {
            python -m pip install --upgrade pip
          }
          python -m pip install "pytest<9"
          python -m pip install ".[parser-tree-sitter]"
          cseq --version
          cseq doctor
          python -m pytest -q
          cseq docs all --output-dir ../docs-smoke

  latest-stable-python:
    name: Windows / latest stable Python from setup-python
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Restore validated source and apply compatibility overlays
        shell: pwsh
        run: |
          $parts = Get-ChildItem release/cseq_poc.zip.b64.part-* | Sort-Object Name
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          [IO.File]::WriteAllBytes("cseq_poc.zip", [Convert]::FromBase64String($b64))
          $actual = (Get-FileHash cseq_poc.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne "4a998011933c8cbe4012e00caa1552c1e964cc6c93185a4711e4afaa3963cf29") {
            throw "validated source archive checksum mismatch: $actual"
          }
          Expand-Archive cseq_poc.zip -DestinationPath source
          Copy-Item release/overlay-0.0.2/* source/ -Recurse -Force
          Copy-Item release/overlay-0.0.3/* source/ -Recurse -Force
          Copy-Item release/overlay-0.0.4/* source/ -Recurse -Force

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
          check-latest: true

      - name: Ensure LLVM/Clang
        shell: pwsh
        run: |
          if (-not (Get-Command clang -ErrorAction SilentlyContinue)) {
            choco install llvm --no-progress -y
          }
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install and test latest stable
        shell: pwsh
        working-directory: source
        run: |
          python --version
          python -m pip install --upgrade pip
          python -m pip install "pytest<9"
          python -m pip install ".[parser-tree-sitter]"
          cseq --version
          cseq doctor
          python -m pytest -q
          cseq docs all --output-dir ../docs-smoke
